name: Deploy to Server

on:
  push:
    branches:
      - claude/eloquent-wozniak-7v4lwp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: claude/eloquent-wozniak-7v4lwp

      - name: Deploy via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "index.html,game.html,.github"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Verify Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            ls -la ${{ secrets.DEPLOY_PATH }}/
            echo "✅ Deployment successful!"

      - name: Notify on Success
        if: success()
        run: echo "Game deployed successfully to server"

      - name: Notify on Failure
        if: failure()
        run: echo "Deployment failed - check SSH credentials"
