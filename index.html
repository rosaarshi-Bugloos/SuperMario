<title>Pixel Plumber - Retro Arcade</title>
<style>
  *{ box-sizing:border-box; }
  body{
    background: linear-gradient(to bottom, #FF006E, #FB5607, #FFBE0B);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    font-family: 'Arial Black', sans-serif;
  }

  .title-screen{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
  }

  .title-box{
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 4px;
    border: 4px solid #000;
  }

  .title-box h1{
    font-size: 64px;
    margin: 0;
    color: #FFFF00;
    text-shadow: 4px 4px 0px #FF006E, -2px -2px 0px #000;
    font-family: 'Courier New', monospace;
    letter-spacing: 3px;
    font-weight: bold;
  }

  .start-text{
    background: #000;
    color: #FFFF00;
    padding: 12px 24px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    border: 2px solid #FFFF00;
    box-shadow: 0 4px 0px #FF006E;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .start-text:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 0px #FF006E;
  }

  .start-text:active{
    transform: translateY(2px);
    box-shadow: 0 2px 0px #FF006E;
  }

  .button-group{
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn{
    background: #FF006E;
    color: #FFF;
    padding: 12px 20px;
    border-radius: 2px;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 3px 0px #C1003D;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Arial Black', sans-serif;
    text-decoration: none;
    display: inline-block;
  }

  .btn:nth-child(2){
    background: #FB5607;
    box-shadow: 0 3px 0px #C23B05;
  }

  .btn:nth-child(2):active, .btn:nth-child(2):hover{
    box-shadow: 0 3px 0px #C23B05;
  }

  .btn:hover, .btn:active{
    transform: translateY(2px);
    box-shadow: 0 1px 0px #C1003D;
  }

  .btn:nth-child(2):hover, .btn:nth-child(2):active{
    box-shadow: 0 1px 0px #C23B05;
  }

  .copyright{
    font-size: 11px;
    color: #000;
    margin: 0;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    letter-spacing: 1px;
  }

  #guideModal{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  #guideModal.show{
    display: flex;
  }

  .modal-content{
    background: linear-gradient(to bottom, #FF006E, #FB5607);
    padding: 24px;
    border-radius: 4px;
    max-width: 480px;
    margin: 20px;
    border: 4px solid #000;
    box-shadow: 0 8px 0px rgba(0,0,0,0.5);
  }

  .modal-content h2{
    margin-top: 0;
    color: #FFFF00;
    text-shadow: 2px 2px 0px #000;
    font-size: 28px;
    font-family: 'Courier New', monospace;
  }

  .modal-content table{
    width: 100%;
    border-collapse: collapse;
    background: #000;
    border: 2px solid #FFFF00;
  }

  .modal-content tr{
    border-bottom: 1px solid #FFFF00;
  }

  .modal-content td{
    padding: 8px;
    text-align: left;
    color: #FFFF00;
    font-family: 'Courier New', monospace;
    font-size: 11px;
  }

  .modal-content td:first-child{
    font-weight: bold;
    width: 40%;
  }

  .close-btn{
    margin-top: 16px;
    background: #FFFF00;
    color: #000;
    border: 2px solid #000;
    padding: 10px 20px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 2px;
    font-family: 'Courier New', monospace;
    transition: all 0.2s;
  }

  .close-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 4px 0px #000;
  }

  .close-btn:active{
    transform: translateY(2px);
  }

  @media (max-width: 640px){
    .title-box h1{
      font-size: 48px;
    }
    .button-group{
      flex-direction: column;
      width: 100%;
    }
    .btn{
      width: 100%;
    }
    .start-text{
      width: 100%;
    }
  }
</style>

<body>
<div class="title-screen">
  <div class="title-box">
    <h1>PIXEL PLUMBER</h1>
  </div>

  <div class="start-text" onclick="document.location='game.html'">
    ▶ PRESS START ◀
  </div>

  <div class="button-group">
    <a href="game.html" class="btn">1P START</a>
    <button class="btn" onclick="showGuide()">SETTINGS</button>
  </div>

  <p class="copyright">© 1985 RETRO GAMES INC.</p>
</div>

<div id="guideModal">
  <div class="modal-content">
    <h2>HOW TO PLAY</h2>
    <table>
      <tr>
        <td>MOVE</td>
        <td>← → / A D</td>
      </tr>
      <tr>
        <td>JUMP</td>
        <td>SPACE / ↑ / W</td>
      </tr>
      <tr>
        <td>RESTART</td>
        <td>R KEY</td>
      </tr>
      <tr>
        <td>MUSHROOM</td>
        <td>GROW BIG</td>
      </tr>
      <tr>
        <td>COINS</td>
        <td>+POINTS</td>
      </tr>
      <tr>
        <td>ENEMIES</td>
        <td>JUMP ON</td>
      </tr>
      <tr>
        <td>FLAG</td>
        <td>WIN!</td>
      </tr>
    </table>
    <button class="close-btn" onclick="hideGuide()">CLOSE</button>
  </div>
</div>

<script>
function showGuide(){
  document.getElementById('guideModal').classList.add('show');
}
function hideGuide(){
  document.getElementById('guideModal').classList.remove('show');
}
window.addEventListener('click', function(e){
  const modal = document.getElementById('guideModal');
  if(e.target === modal) hideGuide();
});
document.addEventListener('keydown', function(e){
  if(e.code === 'Escape') hideGuide();
});
</script>
</body>
